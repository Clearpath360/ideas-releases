# Any push that changes android/ builds the Elevate APK and publishes it as the latest release.
# Download on the phone: https://github.com/Clearpath360/ideas-releases/releases/latest/download/INT_Elevate.apk
name: build
on:
  push:
    branches: [main]
    paths: ['android/**', '.github/workflows/build.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'
      - name: Build
        id: b
        env:
          VCODE: ${{ github.run_number }}
        run: |
          set -o pipefail
          cd android
          gradle assembleRelease --no-daemon --stacktrace 2>&1 | tee ../build-log.txt
      - name: Save build log to the repo
        if: always()
        run: |
          mkdir -p logs
          { echo "run ${{ github.run_number }}: ${{ steps.b.outcome }}"; tail -n 300 build-log.txt; } > logs/last-build.txt
          git config user.name github-actions
          git config user.email github-actions@users.noreply.github.com
          git add logs/last-build.txt
          git commit -m "Build log run ${{ github.run_number }}" || true
          git pull --rebase && git push || true
      - name: Publish release
        if: steps.b.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp android/app/build/outputs/apk/release/app-release.apk INT_Elevate.apk
          gh release create "v1.${{ github.run_number }}" INT_Elevate.apk --title "Elevate 1.${{ github.run_number }}" --notes "Elevate build ${{ github.run_number }}" --latest
